exclude: ^(.idea/)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.7"
    hooks:
      - id: ruff
        name: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.1
    hooks:
      - id: isort

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args:
          - "--line-length=120"
          - "--target-version=py311"
          - "--target-version=py312"
          - "--target-version=py313"
          - "--target-version=py314"
        types: [python]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        # Use the same Black as the hook above so docstring/code-block formatting
        # matches the rest of the codebase (the old 23.3.0 pin disagreed with Black 26).
        additional_dependencies:
          - "black==26.5.1"
        args:
          - "--line-length=120"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-shebang-scripts-are-executable
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^LICENSE|\.(html|csv|txt|svg|py)$
      - id: pretty-format-json
        args: ["--autofix", "--no-ensure-ascii", "--no-sort-keys"]
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.(html|svg)$

  - repo: https://github.com/fredrikaverpil/creosote.git
    rev: v5.2.0
    hooks:
      - id: creosote
        files: ^quickup/
        args: ["--path", "quickup", "--exclude-dep", "python-dotenv"]
        exclude: ^tests/

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        additional_dependencies:
          - "python-dotenv"
          - "colorist"
          - "pyclickup"
          - "inquirer"
          - "cyclopts"
          - "pytest"

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: ["--py311-plus"]
