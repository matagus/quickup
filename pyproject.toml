[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "QuickUp"
dynamic = ["version"]
requires-python = ">=3.11"
description = " A colorful command-line client for Clickup written in Python 3.11+."
readme = "README.md"
authors = [
    { name = "Matias Agustin Mendez", email = "matagus@gmail.com" },
]
keywords = [
  "clickup", "console", "python", "cli", "command-line", "task-list", "task-manager", "task-list-manager",
  "terminal-based", "clickup-api", "console-app", "inquirer", "clickup-client", "clickup-cli",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
  "python-dotenv>=1.2.3,<2",
  "colorist>=1.8.15,<2",
  # pyclickup is unmaintained (0.1.4, last release 2019, classifiers stop at 3.7).
  # Upper-bound pinned so an unexpected release cannot silently break the client.
  "pyclickup>=0.1.4,<0.2",
  "inquirer>=3.4.1,<4",
  # 5.0 is in beta with breaking changes; stay on the 4.x line.
  "cyclopts>=4.25.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-mock>=3.15.1,<4",
  "pytest-cov>=7.1.0,<8",
  "coverage>=7.16.1,<8",
  "pre-commit>=4.6.2,<5",
]
docs = [
  # Sphinx 9.1+ requires Python 3.12; 9.0.x is the last line supporting the 3.11 floor.
  "sphinx>=9.0.4,<10",
  "sphinx_rtd_theme>=3.1.0,<4",
  "gitpython>=3.1.62,<4",
  "sphinx-copybutton>=0.5.2,<1",
]

[project.scripts]
quickup = "quickup.cli.main:run_app"

[project.urls]
Homepage = "https://github.com/matagus/quickup"
Documentation = "https://quickup.readthedocs.io/en/latest/"
Issues = "https://github.com/matagus/quickup/issues"
Changelog = "https://github.com/matagus/quickup/releases"
Repository = "https://github.com/matagus/quickup"

[tool.hatch.version]
path = "__about__.py"

[tool.hatch.envs.default]
dependencies = [
    "ipython>=9.17.1,<10", "ipdb>=0.13.13,<0.14"
]

[tool.hatch.envs.test]
dependencies = [
    "pytest>=9.1.1,<10", "pytest-mock>=3.15.1,<4", "pytest-cov>=7.1.0,<8"
]

[tool.hatch.envs.default.scripts]
app = "python quickup.py"
install = "pip install -e .[dev]"

[tool.hatch.envs.docs]
dependencies = [
    "sphinx>=9.0.4,<10",
    "sphinx_rtd_theme>=3.1.0,<4",
    "gitpython>=3.1.62,<4",
    "sphinx-copybutton>=0.5.2,<1",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -b html docs/source docs/build"
serve = "python -m http.server 8000 --directory docs/build"

[tool.hatch.envs.debug]
dependencies = ["ipdb>=0.13.13", "line_profiler>=5.0.2"]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.test.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["coverage json", "coverage report"]
cov = ["test-cov", "cov-report"]
app = "python quickup.py"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
fixable = [
    "ALL",
]
unfixable = []
select = ["E", "F", "UP", "B", "SIM", "PLC0415"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["quickup"]
src_paths = ["."]
force_sort_within_sections = true

[tool.pyright]
include = ["quickup", "docs/source/conf.py"]
exclude = ["**/__pycache__"]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["quickup"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# Hard gate: coverage below 90% fails the test run (CI included).
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
